[project]
name = "fulvo"
version = "0.1.0"
description = "App para completar equipos de fútbol (TP final Programación 2, UNSAM)"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = ["fastapi[standard] (>=0.161.1,<0.162.0)"]

[tool.poetry]
# Es una app, no una librería: no se publica como paquete.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
