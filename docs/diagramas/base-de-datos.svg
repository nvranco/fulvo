<svg xmlns="http://www.w3.org/2000/svg" width="940" height="940" viewBox="0 0 940 940" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="28" font-weight="bold" font-size="14">Base de datos (hoy): zonas, complejos, roles y usuarios</text>
<rect x="40" y="60" width="300" height="104" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="40" y="60" width="300" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="190.0" y="78" text-anchor="middle" font-weight="bold">zonas</text>
<text x="48" y="104" font-weight="bold">PK  id: INTEGER</text>
<text x="48" y="130">nombre: VARCHAR  NOT NULL, UNIQUE</text>
<text x="48" y="156">provincia: VARCHAR  NOT NULL</text>
<rect x="520" y="60" width="360" height="390" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="60" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="78" text-anchor="middle" font-weight="bold">complejos</text>
<text x="528" y="104" font-weight="bold">PK  id: INTEGER</text>
<text x="528" y="130">FK  zona_id: INTEGER  NOT NULL</text>
<text x="528" y="156">localidad: VARCHAR  NOT NULL</text>
<text x="528" y="182">nombre: VARCHAR  NOT NULL</text>
<text x="528" y="208">direccion: VARCHAR  NOT NULL</text>
<text x="528" y="234">telefono_contacto: VARCHAR  NULL</text>
<text x="528" y="260">tipo: VARCHAR  NOT NULL</text>
<text x="528" y="286">reserva_online: BOOLEAN  NOT NULL, default false</text>
<text x="528" y="312">sitio_web: VARCHAR  NULL</text>
<text x="528" y="338">calificacion_maps: FLOAT  NULL</text>
<text x="528" y="364">latitud: FLOAT  NOT NULL</text>
<text x="528" y="390">longitud: FLOAT  NOT NULL</text>
<text x="528" y="416">link_maps: VARCHAR  NULL</text>
<line x1="520" y1="424" x2="880" y2="424" stroke="#6c8ebf"/>
<text x="528" y="442" font-style="italic">UNIQUE (nombre, direccion)</text>
<polyline points="340,99 430,99 430,125 520,125" fill="none" stroke="#333"/>
<line x1="350" y1="93" x2="350" y2="105" stroke="#333"/>
<line x1="356" y1="93" x2="356" y2="105" stroke="#333"/>
<line x1="506" y1="125" x2="520" y2="118" stroke="#333"/>
<line x1="506" y1="125" x2="520" y2="132" stroke="#333"/>
<line x1="506" y1="125" x2="520" y2="125" stroke="#333"/>
<text x="40" y="478" font-size="11">1 zona : N complejos (complejos.zona_id -> zonas.id)</text>
<rect x="40" y="200" width="300" height="146" fill="#fff2cc" stroke="#d6b656"/>
<text x="48" y="222" font-size="11">Nota: complejos lleva solo las columnas</text>
<text x="48" y="240" font-size="11">que usa la API hoy. Se agregan con</text>
<text x="48" y="258" font-size="11">migraciones cuando haga falta (RQ8 y otros):</text>
<text x="48" y="276" font-size="11">- puntuacion_promedio</text>
<text x="48" y="294" font-size="11">- cantidad_puntuaciones</text>
<text x="48" y="312" font-size="11">- whatsapp_contacto</text>
<text x="48" y="330" font-size="11">- email_contacto</text>
<rect x="40" y="530" width="300" height="78" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="40" y="530" width="300" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="190.0" y="548" text-anchor="middle" font-weight="bold">roles</text>
<text x="48" y="574" font-weight="bold">PK  id: INTEGER</text>
<text x="48" y="600">nombre: VARCHAR  NOT NULL, UNIQUE</text>
<rect x="520" y="530" width="360" height="364" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="530" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="548" text-anchor="middle" font-weight="bold">usuarios</text>
<text x="528" y="574" font-weight="bold">PK  id: INTEGER</text>
<text x="528" y="600">email: VARCHAR  NOT NULL, UNIQUE</text>
<text x="528" y="626">contrasena_hash: VARCHAR  NOT NULL</text>
<text x="528" y="652">nombre: VARCHAR  NOT NULL</text>
<text x="528" y="678">apellido: VARCHAR  NOT NULL</text>
<text x="528" y="704">whatsapp: VARCHAR  NOT NULL</text>
<text x="528" y="730">fecha_nacimiento: DATE  NOT NULL</text>
<text x="528" y="756">posicion: VARCHAR  NOT NULL</text>
<text x="528" y="782">FK  rol_id: INTEGER  NOT NULL</text>
<text x="528" y="808">bloqueado: BOOLEAN  NOT NULL, default false</text>
<text x="528" y="834">puntuacion_promedio: FLOAT  NULL</text>
<text x="528" y="860">cantidad_puntuaciones: INTEGER  NOT NULL, default 0</text>
<text x="528" y="886">partidos_jugados: INTEGER  NOT NULL, default 0</text>
<polyline points="340,569 430,569 430,777 520,777" fill="none" stroke="#333"/>
<line x1="350" y1="563" x2="350" y2="575" stroke="#333"/>
<line x1="356" y1="563" x2="356" y2="575" stroke="#333"/>
<line x1="506" y1="777" x2="520" y2="770" stroke="#333"/>
<line x1="506" y1="777" x2="520" y2="784" stroke="#333"/>
<line x1="506" y1="777" x2="520" y2="777" stroke="#333"/>
<text x="40" y="922" font-size="11">1 rol : N usuarios (usuarios.rol_id -&gt; roles.id)</text>
<rect x="40" y="640" width="300" height="166" fill="#fff2cc" stroke="#d6b656"/>
<text x="48" y="662" font-size="11">Nota: los roles base (usuario y admin) los</text>
<text x="48" y="680" font-size="11">crea la carga inicial; ningún endpoint</text>
<text x="48" y="698" font-size="11">asigna el rol admin.</text>
<text x="48" y="716" font-size="11">contrasena_hash guarda el hash argon2,</text>
<text x="48" y="734" font-size="11">nunca la contraseña.</text>
<text x="48" y="752" font-size="11">Las puntuaciones y partidos_jugados los</text>
<text x="48" y="770" font-size="11">calcula la app (RQ8). La sanción del</text>
<text x="48" y="788" font-size="11">bloqueo llega con RQ10 (tabla sanciones).</text>
</svg>