<line x1="894" y1="1647" x2="880" y2="1640" stroke="#333"/>
<line x1="894" y1="1647" x2="880" y2="1654" stroke="#333"/>
<line x1="894" y1="1647" x2="880" y2="1647" stroke="#333"/>
<line x1="510" y1="1433" x2="510" y2="1445" stroke="#333"/>
<line x1="504" y1="1433" x2="504" y2="1445" stroke="#333"/>
<polyline points="520,1439 480,1439 480,1175 340,1175" fill="none" stroke="#333"/>
<line x1="354" y1="1175" x2="340" y2="1168" stroke="#333"/>
