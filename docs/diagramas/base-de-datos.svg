<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1900" viewBox="0 0 1420 1900" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="28" font-weight="bold" font-size="14">Base de datos (hoy): zonas, complejos, roles, usuarios, partidos, postulaciones, notificaciones, votaciones, sanciones y reclamos</text>
<rect x="40" y="60" width="300" height="104" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="40" y="60" width="300" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="190.0" y="78" text-anchor="middle" font-weight="bold">zonas</text>
<text x="48" y="104" font-weight="bold">PK  id: INTEGER</text>
<text x="48" y="130">nombre: VARCHAR  NOT NULL, UNIQUE</text>
<text x="48" y="156">provincia: VARCHAR  NOT NULL</text>
<rect x="520" y="60" width="360" height="442" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="60" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="78" text-anchor="middle" font-weight="bold">complejos</text>
<text x="528" y="104" font-weight="bold">PK  id: INTEGER</text>
<text x="528" y="130">FK  zona_id: INTEGER  NOT NULL</text>
<text x="528" y="156">localidad: VARCHAR  NOT NULL</text>
<text x="528" y="182">nombre: VARCHAR  NOT NULL</text>
<text x="528" y="208">direccion: VARCHAR  NOT NULL</text>
<text x="528" y="234">telefono_contacto: VARCHAR  NULL</text>
<text x="528" y="260">tipo: VARCHAR  NOT NULL</text>
<text x="528" y="286">reserva_online: BOOLEAN  NOT NULL, default false</text>
<text x="528" y="312">sitio_web: VARCHAR  NULL</text>
<text x="528" y="338">calificacion_maps: FLOAT  NULL</text>
<text x="528" y="364">latitud: FLOAT  NOT NULL</text>
<text x="528" y="390">longitud: FLOAT  NOT NULL</text>
<text x="528" y="416">link_maps: VARCHAR  NULL</text>
<text x="528" y="442">puntuacion_promedio: FLOAT  NULL</text>
<text x="528" y="468">cantidad_puntuaciones: INTEGER  NOT NULL, default 0</text>
<line x1="520" y1="476" x2="880" y2="476" stroke="#6c8ebf"/>
<text x="528" y="494" font-style="italic">UNIQUE (nombre, direccion)</text>
<polyline points="340,99 430,99 430,125 520,125" fill="none" stroke="#333"/>
<line x1="350" y1="93" x2="350" y2="105" stroke="#333"/>
<line x1="356" y1="93" x2="356" y2="105" stroke="#333"/>
<line x1="506" y1="125" x2="520" y2="118" stroke="#333"/>
<line x1="506" y1="125" x2="520" y2="132" stroke="#333"/>
<line x1="506" y1="125" x2="520" y2="125" stroke="#333"/>
<text x="40" y="478" font-size="11">1 zona : N complejos (complejos.zona_id -> zonas.id)</text>
<rect x="40" y="200" width="300" height="128" fill="#fff2cc" stroke="#d6b656"/>
<text x="48" y="222" font-size="11">Nota: complejos lleva solo las columnas</text>
<text x="48" y="240" font-size="11">que usa la API hoy. Se agregan con</text>
<text x="48" y="258" font-size="11">migraciones cuando haga falta:</text>
<text x="48" y="276" font-size="11">- whatsapp_contacto</text>
<text x="48" y="294" font-size="11">- email_contacto</text>
<text x="48" y="312" font-size="11">La puntuación sale de las votaciones (RQ8).</text>
<rect x="40" y="530" width="300" height="78" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="40" y="530" width="300" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="190.0" y="548" text-anchor="middle" font-weight="bold">roles</text>
<text x="48" y="574" font-weight="bold">PK  id: INTEGER</text>
<text x="48" y="600">nombre: VARCHAR  NOT NULL, UNIQUE</text>
<rect x="520" y="530" width="360" height="364" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="530" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="548" text-anchor="middle" font-weight="bold">usuarios</text>
<text x="528" y="574" font-weight="bold">PK  id: INTEGER</text>
<text x="528" y="600">email: VARCHAR  NOT NULL, UNIQUE</text>
<text x="528" y="626">contrasena_hash: VARCHAR  NOT NULL</text>
<text x="528" y="652">nombre: VARCHAR  NOT NULL</text>
<text x="528" y="678">apellido: VARCHAR  NOT NULL</text>
<text x="528" y="704">whatsapp: VARCHAR  NOT NULL</text>
<text x="528" y="730">fecha_nacimiento: DATE  NOT NULL</text>
<text x="528" y="756">posicion: VARCHAR  NOT NULL</text>
<text x="528" y="782">FK  rol_id: INTEGER  NOT NULL</text>
<text x="528" y="808">bloqueado: BOOLEAN  NOT NULL, default false</text>
<text x="528" y="834">puntuacion_promedio: FLOAT  NULL</text>
<text x="528" y="860">cantidad_puntuaciones: INTEGER  NOT NULL, default 0</text>
<text x="528" y="886">partidos_jugados: INTEGER  NOT NULL, default 0</text>
<polyline points="340,569 430,569 430,777 520,777" fill="none" stroke="#333"/>
<line x1="350" y1="563" x2="350" y2="575" stroke="#333"/>
<line x1="356" y1="563" x2="356" y2="575" stroke="#333"/>
<line x1="506" y1="777" x2="520" y2="770" stroke="#333"/>
<line x1="506" y1="777" x2="520" y2="784" stroke="#333"/>
<line x1="506" y1="777" x2="520" y2="777" stroke="#333"/>
<text x="40" y="922" font-size="11">1 rol : N usuarios (usuarios.rol_id -&gt; roles.id)</text>
<rect x="40" y="640" width="300" height="166" fill="#fff2cc" stroke="#d6b656"/>
<text x="48" y="662" font-size="11">Nota: los roles base (usuario y admin) los</text>
<text x="48" y="680" font-size="11">crea la carga inicial; ningún endpoint</text>
<text x="48" y="698" font-size="11">asigna el rol admin.</text>
<text x="48" y="716" font-size="11">contrasena_hash guarda el hash argon2,</text>
<text x="48" y="734" font-size="11">nunca la contraseña.</text>
<text x="48" y="752" font-size="11">Las puntuaciones y partidos_jugados los</text>
<text x="48" y="770" font-size="11">calcula la app (RQ8). Cada bloqueo queda</text>
<text x="48" y="788" font-size="11">registrado en sanciones (RQ10).</text>
<rect x="960" y="300" width="360" height="234" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="960" y="300" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="1140.0" y="318" text-anchor="middle" font-weight="bold">partidos</text>
<text x="968" y="344" font-weight="bold">PK  id: INTEGER</text>
<text x="968" y="370">FK  complejo_id: INTEGER  NOT NULL</text>
<text x="968" y="396">FK  organizador_id: INTEGER  NOT NULL</text>
<text x="968" y="422">inicio: DATETIME  NOT NULL</text>
<text x="968" y="448">tipo: VARCHAR  NOT NULL (F5, F7, F8, F11)</text>
<text x="968" y="474">cupos_faltantes: INTEGER  NOT NULL</text>
<text x="968" y="500">duracion_minutos: INTEGER  NOT NULL, default 60</text>
<text x="968" y="526">estado: VARCHAR  NOT NULL, default abierto</text>
<polyline points="880,99 920,99 920,365 960,365" fill="none" stroke="#333"/>
<line x1="890" y1="93" x2="890" y2="105" stroke="#333"/>
<line x1="896" y1="93" x2="896" y2="105" stroke="#333"/>
<line x1="946" y1="365" x2="960" y2="358" stroke="#333"/>
<line x1="946" y1="365" x2="960" y2="372" stroke="#333"/>
<line x1="946" y1="365" x2="960" y2="365" stroke="#333"/>
<polyline points="880,569 930,569 930,391 960,391" fill="none" stroke="#333"/>
<line x1="890" y1="563" x2="890" y2="575" stroke="#333"/>
<line x1="896" y1="563" x2="896" y2="575" stroke="#333"/>
<line x1="946" y1="391" x2="960" y2="384" stroke="#333"/>
<line x1="946" y1="391" x2="960" y2="398" stroke="#333"/>
<line x1="946" y1="391" x2="960" y2="391" stroke="#333"/>
<text x="960" y="562" font-size="11">1 complejo : N partidos (partidos.complejo_id -&gt; complejos.id)</text>
<text x="960" y="580" font-size="11">1 usuario : N partidos (partidos.organizador_id -&gt; usuarios.id)</text>
<rect x="960" y="604" width="300" height="104" fill="#fff2cc" stroke="#d6b656"/>
<text x="968" y="626" font-size="11">Nota: inicio se guarda en hora de Argentina,</text>
<text x="968" y="644" font-size="11">sin zona horaria. tipo y estado son enums</text>
<text x="968" y="662" font-size="11">que se guardan como texto. La duración es</text>
<text x="968" y="680" font-size="11">siempre de 60 minutos. Un complejo con</text>
<text x="968" y="698" font-size="11">partidos no se puede borrar (409).</text>
<rect x="960" y="760" width="360" height="234" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="960" y="760" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="1140.0" y="778" text-anchor="middle" font-weight="bold">postulaciones</text>
<text x="968" y="804" font-weight="bold">PK  id: INTEGER</text>
<text x="968" y="830">FK  partido_id: INTEGER  NOT NULL</text>
<text x="968" y="856">FK  jugador_id: INTEGER  NOT NULL</text>
<text x="968" y="882">estado: VARCHAR  NOT NULL, default en_espera</text>
<text x="968" y="908">created_at: DATETIME  NOT NULL</text>
<text x="968" y="934">respondida_at: DATETIME  NULL</text>
<text x="968" y="960">no_show: BOOLEAN  NOT NULL, default false</text>
<line x1="960" y1="968" x2="1320" y2="968" stroke="#6c8ebf"/>
<text x="968" y="986" font-style="italic">UNIQUE (partido_id, jugador_id)</text>
<polyline points="1320,339 1345,339 1345,825 1320,825" fill="none" stroke="#333"/>
<line x1="1330" y1="333" x2="1330" y2="345" stroke="#333"/>
<line x1="1336" y1="333" x2="1336" y2="345" stroke="#333"/>
<line x1="1334" y1="825" x2="1320" y2="818" stroke="#333"/>
<line x1="1334" y1="825" x2="1320" y2="832" stroke="#333"/>
<line x1="1334" y1="825" x2="1320" y2="825" stroke="#333"/>
<polyline points="880,569 900,569 900,851 960,851" fill="none" stroke="#333"/>
<line x1="946" y1="851" x2="960" y2="844" stroke="#333"/>
<line x1="946" y1="851" x2="960" y2="858" stroke="#333"/>
<line x1="946" y1="851" x2="960" y2="851" stroke="#333"/>
<text x="960" y="1022" font-size="11">1 partido : N postulaciones (partido_id -&gt; partidos.id)</text>
<text x="960" y="1040" font-size="11">1 usuario : N postulaciones (jugador_id -&gt; usuarios.id)</text>
<rect x="960" y="1064" width="300" height="104" fill="#fff2cc" stroke="#d6b656"/>
<text x="968" y="1086" font-size="11">Nota: un jugador se postula una sola vez a</text>
<text x="968" y="1104" font-size="11">cada partido (UNIQUE). estado es un enum</text>
<text x="968" y="1122" font-size="11">guardado como texto. El WhatsApp no se</text>
<text x="968" y="1140" font-size="11">guarda acá: se muestra según el estado.</text>
<text x="968" y="1158" font-size="11">no_show lo marca el organizador (RQ8).</text>
<rect x="520" y="960" width="360" height="234" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="960" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="978" text-anchor="middle" font-weight="bold">notificaciones</text>
<text x="528" y="1004" font-weight="bold">PK  id: INTEGER</text>
<text x="528" y="1030">FK  usuario_id: INTEGER  NOT NULL</text>
<text x="528" y="1056">tipo: VARCHAR(30)  NOT NULL</text>
<text x="528" y="1082">mensaje: VARCHAR  NOT NULL</text>
<text x="528" y="1108">referencia_tipo: VARCHAR  NOT NULL</text>
<text x="528" y="1134">referencia_id: INTEGER  NOT NULL</text>
<text x="528" y="1160">leida: BOOLEAN  NOT NULL, default false</text>
<text x="528" y="1186">created_at: DATETIME  NOT NULL</text>
<polyline points="880,569 900,569 900,1025 880,1025" fill="none" stroke="#333"/>
<line x1="894" y1="1025" x2="880" y2="1018" stroke="#333"/>
<line x1="894" y1="1025" x2="880" y2="1032" stroke="#333"/>
<line x1="894" y1="1025" x2="880" y2="1025" stroke="#333"/>
<text x="520" y="1222" font-size="11">1 usuario : N notificaciones (usuario_id -&gt; usuarios.id)</text>
<rect x="520" y="1246" width="300" height="104" fill="#fff2cc" stroke="#d6b656"/>
<text x="528" y="1268" font-size="11">Nota: la referencia (tipo e id) dice qué</text>
<text x="528" y="1286" font-size="11">originó el aviso, sin clave foránea: una</text>
<text x="528" y="1304" font-size="11">postulación o un partido. El mensaje se</text>
<text x="528" y="1322" font-size="11">guarda armado por FabricaNotificaciones</text>
<text x="528" y="1340" font-size="11">y nunca lleva el WhatsApp.</text>
<rect x="960" y="1210" width="360" height="338" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="960" y="1210" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="1140.0" y="1228" text-anchor="middle" font-weight="bold">votaciones</text>
<text x="968" y="1254" font-weight="bold">PK  id: INTEGER</text>
<text x="968" y="1280">FK  partido_id: INTEGER  NOT NULL</text>
<text x="968" y="1306">FK  emisor_id: INTEGER  NOT NULL</text>
<text x="968" y="1332">created_at: DATETIME  NOT NULL</text>
<text x="968" y="1358">FK  receptor_usuario_id: INTEGER  NULL</text>
<text x="968" y="1384">FK  receptor_complejo_id: INTEGER  NULL</text>
<text x="968" y="1410">estado: VARCHAR  NOT NULL, default pendiente</text>
<text x="968" y="1436">estrellas: INTEGER  NULL (0 a 5)</text>
<text x="968" y="1462">emitida_at: DATETIME  NULL</text>
<line x1="960" y1="1470" x2="1320" y2="1470" stroke="#6c8ebf"/>
<text x="968" y="1488" font-style="italic">CHECK un_solo_receptor (usuario o complejo, uno solo)</text>
<text x="968" y="1514" font-style="italic">UNIQUE (partido_id, emisor_id, receptor_usuario_id)</text>
<text x="968" y="1540" font-style="italic">UNIQUE (partido_id, emisor_id, receptor_complejo_id)</text>
<polyline points="1320,339 1370,339 1370,1275 1320,1275" fill="none" stroke="#333"/>
<line x1="1334" y1="1275" x2="1320" y2="1268" stroke="#333"/>
<line x1="1334" y1="1275" x2="1320" y2="1282" stroke="#333"/>
<line x1="1334" y1="1275" x2="1320" y2="1275" stroke="#333"/>
<polyline points="880,569 900,569 900,1301 960,1301" fill="none" stroke="#333"/>
<line x1="946" y1="1301" x2="960" y2="1294" stroke="#333"/>
<line x1="946" y1="1301" x2="960" y2="1308" stroke="#333"/>
<line x1="946" y1="1301" x2="960" y2="1301" stroke="#333"/>
<polyline points="880,569 900,569 900,1353 960,1353" fill="none" stroke="#333"/>
<line x1="946" y1="1353" x2="960" y2="1346" stroke="#333"/>
<line x1="946" y1="1353" x2="960" y2="1360" stroke="#333"/>
<line x1="946" y1="1353" x2="960" y2="1353" stroke="#333"/>
<polyline points="880,99 1395,99 1395,1379 1320,1379" fill="none" stroke="#333"/>
<line x1="1334" y1="1379" x2="1320" y2="1372" stroke="#333"/>
<line x1="1334" y1="1379" x2="1320" y2="1386" stroke="#333"/>
<line x1="1334" y1="1379" x2="1320" y2="1379" stroke="#333"/>
<text x="960" y="1576" font-size="11">1 partido : N votaciones (partido_id -&gt; partidos.id)</text>
<text x="960" y="1594" font-size="11">1 usuario : N votaciones (emisor_id -&gt; usuarios.id)</text>
<text x="960" y="1612" font-size="11">0..1 usuario : N votaciones (receptor_usuario_id -&gt; usuarios.id)</text>
<text x="960" y="1630" font-size="11">0..1 complejo : N votaciones (receptor_complejo_id -&gt; complejos.id)</text>
<rect x="960" y="1654" width="300" height="122" fill="#fff2cc" stroke="#d6b656"/>
<text x="968" y="1676" font-size="11">Nota: el receptor es un usuario o el</text>
<text x="968" y="1694" font-size="11">complejo, uno solo (CHECK). Un voto por</text>
<text x="968" y="1712" font-size="11">emisor y receptor en cada partido (UNIQUE).</text>
<text x="968" y="1730" font-size="11">Las pendientes se borran con un no-show:</text>
<text x="968" y="1748" font-size="11">la tabla no reutiliza ids (AUTOINCREMENT).</text>
<text x="968" y="1766" font-size="11">Un reclamo puede anular una emitida (RQ11).</text>
<rect x="40" y="980" width="300" height="208" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="40" y="980" width="300" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="190.0" y="998" text-anchor="middle" font-weight="bold">sanciones</text>
<text x="48" y="1024" font-weight="bold">PK  id: INTEGER</text>
<text x="48" y="1050">FK  usuario_id: INTEGER  NOT NULL</text>
<text x="48" y="1076">FK  aplicada_por_id: INTEGER  NOT NULL</text>
<text x="48" y="1102">motivo: VARCHAR  NOT NULL</text>
<text x="48" y="1128">desde: DATETIME  NOT NULL</text>
<text x="48" y="1154">hasta: DATETIME  NULL</text>
<text x="48" y="1180">FK  reclamo_id: INTEGER  NULL</text>
<line x1="510" y1="563" x2="510" y2="575" stroke="#333"/>
<line x1="504" y1="563" x2="504" y2="575" stroke="#333"/>
<polyline points="520,569 470,569 470,1045 340,1045" fill="none" stroke="#333"/>
<line x1="354" y1="1045" x2="340" y2="1038" stroke="#333"/>
<line x1="354" y1="1045" x2="340" y2="1052" stroke="#333"/>
<line x1="354" y1="1045" x2="340" y2="1045" stroke="#333"/>
<polyline points="520,569 470,569 470,1071 340,1071" fill="none" stroke="#333"/>
<line x1="354" y1="1071" x2="340" y2="1064" stroke="#333"/>
<line x1="354" y1="1071" x2="340" y2="1078" stroke="#333"/>
<line x1="354" y1="1071" x2="340" y2="1071" stroke="#333"/>
<text x="40" y="1216" font-size="11">1 usuario : N sanciones (usuario_id -&gt; usuarios.id)</text>
<text x="40" y="1234" font-size="11">1 admin : N sanciones (aplicada_por_id -&gt; usuarios.id)</text>
<rect x="40" y="1276" width="300" height="130" fill="#fff2cc" stroke="#d6b656"/>
<text x="48" y="1298" font-size="11">Nota: una fila por bloqueo, que no se borra:</text>
<text x="48" y="1316" font-size="11">desbloquear completa hasta. Una sola activa</text>
<text x="48" y="1334" font-size="11">por usuario (lo controla el modelo).</text>
<text x="48" y="1352" font-size="11">usuarios.bloqueado se mantiene al día con</text>
<text x="48" y="1370" font-size="11">la sanción. reclamo_id es la denuncia que</text>
<text x="48" y="1388" font-size="11">la originó, si la hay (RQ11).</text>
<rect x="520" y="1400" width="360" height="286" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="1400" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="1418" text-anchor="middle" font-weight="bold">reclamos</text>
<text x="528" y="1444" font-weight="bold">PK  id: INTEGER</text>
<text x="528" y="1470">FK  autor_id: INTEGER  NOT NULL</text>
<text x="528" y="1496">tipo_objetivo: VARCHAR  NOT NULL</text>
<text x="528" y="1522">objetivo_id: INTEGER  NOT NULL (sin FK)</text>
<text x="528" y="1548">motivo: VARCHAR  NOT NULL</text>
<text x="528" y="1574">created_at: DATETIME  NOT NULL</text>
<text x="528" y="1600">estado: VARCHAR  NOT NULL, default abierto</text>
<text x="528" y="1626">resolucion: VARCHAR  NULL</text>
<text x="528" y="1652">FK  resuelto_por_id: INTEGER  NULL</text>
<text x="528" y="1678">resuelto_at: DATETIME  NULL</text>
<polyline points="880,569 900,569 900,1465 880,1465" fill="none" stroke="#333"/>
<line x1="894" y1="1465" x2="880" y2="1458" stroke="#333"/>
