<svg xmlns="http://www.w3.org/2000/svg" width="940" height="490" viewBox="0 0 940 490" font-family="Helvetica, Arial, sans-serif" font-size="12">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="28" font-weight="bold" font-size="14">Base de datos (hoy): solo zonas y complejos</text>
<rect x="40" y="60" width="300" height="104" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="40" y="60" width="300" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="190.0" y="78" text-anchor="middle" font-weight="bold">zonas</text>
<text x="48" y="104" font-weight="bold">PK  id: INTEGER</text>
<text x="48" y="130">nombre: VARCHAR  NOT NULL, UNIQUE</text>
<text x="48" y="156">provincia: VARCHAR  NOT NULL</text>
<rect x="520" y="60" width="360" height="390" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="520" y="60" width="360" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="700.0" y="78" text-anchor="middle" font-weight="bold">complejos</text>
<text x="528" y="104" font-weight="bold">PK  id: INTEGER</text>
<text x="528" y="130">FK  zona_id: INTEGER  NOT NULL</text>
<text x="528" y="156">localidad: VARCHAR  NOT NULL</text>
<text x="528" y="182">nombre: VARCHAR  NOT NULL</text>
<text x="528" y="208">direccion: VARCHAR  NOT NULL</text>
<text x="528" y="234">telefono_contacto: VARCHAR  NULL</text>
<text x="528" y="260">tipo: VARCHAR  NOT NULL</text>
<text x="528" y="286">reserva_online: BOOLEAN  NOT NULL, default false</text>
<text x="528" y="312">sitio_web: VARCHAR  NULL</text>
<text x="528" y="338">calificacion_maps: FLOAT  NULL</text>
<text x="528" y="364">latitud: FLOAT  NOT NULL</text>
<text x="528" y="390">longitud: FLOAT  NOT NULL</text>
<text x="528" y="416">link_maps: VARCHAR  NULL</text>
<line x1="520" y1="424" x2="880" y2="424" stroke="#6c8ebf"/>
<text x="528" y="442" font-style="italic">UNIQUE (nombre, direccion)</text>
<polyline points="340,99 430,99 430,125 520,125" fill="none" stroke="#333"/>
<line x1="350" y1="93" x2="350" y2="105" stroke="#333"/>
<line x1="356" y1="93" x2="356" y2="105" stroke="#333"/>
<line x1="506" y1="125" x2="520" y2="118" stroke="#333"/>
<line x1="506" y1="125" x2="520" y2="132" stroke="#333"/>
<line x1="506" y1="125" x2="520" y2="125" stroke="#333"/>
<text x="40" y="478" font-size="11">1 zona : N complejos (complejos.zona_id -> zonas.id)</text>
</svg>